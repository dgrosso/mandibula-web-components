<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Counter examples." />
    <title>Counter · Mandíbula</title>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="demo-header">
      <div class="demo-header__inner">
        <a class="demo-brand" href="../">Mandíbula Web Components</a
        ><a href="https://github.com/dgrosso/mandibula-web-components"
          >GitHub</a
        >
      </div>
    </header>
    <div class="demo-layout">
      <aside class="demo-sidebar">
        <nav class="demo-nav" aria-label="Component demos" data-demo-nav></nav>
      </aside>
      <main id="content" class="demo-main" tabindex="-1">
        <header class="demo-intro">
          <p class="demo-kicker">mdb-counter</p>
          <h1>Counter</h1>
          <p>
            Animates a locale-formatted integer when it enters the viewport.
          </p>
        </header>
        <div class="demo-grid">
          <section class="demo-card">
            <h2>Default</h2>
            <div class="demo-stage">
              <mdb-counter value="12850"></mdb-counter>
            </div>
            <code class="demo-code"
              >Properties: value, start, duration, locale.</code
            >
          </section>
          <section class="demo-card">
            <h2>Custom range</h2>
            <div class="demo-stage">
              <mdb-counter start="40" value="100" duration="2400"></mdb-counter>
            </div>
            <code class="demo-code"
              >Animation moves from start to value once.</code
            >
          </section>
          <section class="demo-card">
            <h2>Locale</h2>
            <div class="demo-stage">
              <mdb-counter value="1234567" locale="de-DE"></mdb-counter>
            </div>
            <code class="demo-code">Uses locale-aware number formatting.</code>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="../main.js"></script>
  </body>
</html>
