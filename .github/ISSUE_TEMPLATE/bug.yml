name: Bug report
description: Report a reproducible component defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - accessible-menu
        - carousel
        - clickable-area
        - collapsible
        - counter
        - document-preview-button
        - fader
        - media-slot
        - modal
        - pagination
        - paper
        - pointer
        - post-loop
        - responsive-text
        - scoped-inline-svg
        - spinner
        - suspense
        - video
        - video-modal-button
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include plain HTML where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and framework
    validations:
      required: true
